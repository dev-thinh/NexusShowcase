name: Main promotion policy

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: main-promotion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  main-source-policy:
    name: main-source-policy
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      # Pin policy code to the trusted workflow commit, never the PR branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: ops/production
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require same-repository dev and wait for its exact CI
        run: node ops/production/promotion.mjs pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
