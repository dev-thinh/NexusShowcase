name: Main promotion policy

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions: {}

jobs:
  main-source-policy:
    name: main-source-policy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require dev from this repository
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const pr = event.pull_request;
          const repository = process.env.GITHUB_REPOSITORY;
          if (!repository || !pr || pr.base?.ref !== 'main' ||
              pr.base?.repo?.full_name !== repository ||
              pr.head?.ref !== 'dev' || pr.head?.repo?.full_name !== repository) {
            console.error('::error::Only a pull request from this repository\'s dev branch may merge into main.');
            process.exit(1);
          }
          console.log('Validated same-repository dev -> main promotion.');
