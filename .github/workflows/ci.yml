name: Repository checks
on:
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  check:
    if: ${{ github.ref == 'refs/heads/dev' }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      AUTH_SECRET: ci-only-random-placeholder-not-for-deployment-2026
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused_runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run check
      - run: npm run build
  database-and-browser:
    if: ${{ github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus_test
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: nexus_showcase_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U nexus_test -d nexus_showcase_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      AUTH_SECRET: ci-only-random-placeholder-not-for-deployment-2026
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused_runtime
      TEST_DATABASE_URL: postgresql://nexus_test:ci_test_only@127.0.0.1:5432/nexus_showcase_test?schema=public
      HARNESS_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run db:verify-upgrade
      - name: Initialize the dedicated test template
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://nexus_test:ci_test_only@127.0.0.1:5432/nexus_showcase_test?schema=public
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: .playwright
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-artifacts
          path: |
            docs/superpowers/reports/database-verification.json
            docs/superpowers/reports/refactor-after/metrics.json
            test-results/navigation-*/trace.zip
            test-results/presentation-*/trace.zip
          if-no-files-found: ignore
  verify-promotion:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: ops/production
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify merged tree and successful dev CI
        run: node ops/production/promotion.mjs main "$GITHUB_SHA"
        env:
          GITHUB_TOKEN: ${{ github.token }}
  deploy:
    needs: [verify-promotion]
    timeout-minutes: 45
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://roboticslab.tail3f6298.ts.net
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - name: Join deployment tailnet with OIDC
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:roboticslab-ci
      - name: Deploy exact checked commit
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_HOST" == '100.69.69.4' ]]
          [[ -n "$DEPLOY_SSH_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]]
          umask 077
          credential_dir=$(mktemp -d "$RUNNER_TEMP/nexus-deploy.XXXXXX")
          trap 'rm -rf -- "$credential_dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$credential_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$credential_dir/known_hosts"
          chmod 600 "$credential_dir/key" "$credential_dir/known_hosts"
          ssh -F /dev/null -p 2222 -i "$credential_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$credential_dir/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            "nexusdeploy@$DEPLOY_HOST" "deploy $GITHUB_SHA $GITHUB_RUN_ID"
