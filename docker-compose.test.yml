services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus_test
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_DB: nexus_showcase_test
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_test -d nexus_showcase_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    # Test-only database; no shared development/production volume.
    tmpfs:
      - /var/lib/postgresql/data
